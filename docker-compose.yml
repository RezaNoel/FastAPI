services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: grove
      POSTGRES_DB: grove
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grove -d grove"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://grove:grove@db:5432/grove
      AUTO_CREATE_TABLES: "false"
      SEED_ON_STARTUP: "true"
      SECRET_KEY: dev-only-compose-secret-change-me-please
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
